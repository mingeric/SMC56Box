</style></head><body><div class="wrap"><div class="toolbar"><div class="field"><label for="cohort">队列</label><select id="cohort"><option value="CRC">CRC · GSE132465</option><option value="BRCA">BRCA · CELLxGENE</option><option value="LUAD_GSE131907">LUAD · GSE131907</option><option value="LUAD">LUAD · CELLxGENE</option></select></div><div class="field"><label for="color">颜色</label><select id="color"><option value="lineage">主要细胞谱系</option><option value="celltype">细胞亚型</option><option value="condition">组织/疾病标签</option><option value="cluster">原始聚类标签</option><optgroup label="SMC5/6 genes"><option>SMC5</option><option>SMC6</option><option>NSMCE1</option><option>NSMCE2</option><option>NSMCE3</option><option>NSMCE4A</option><option>EID3</option><option>SLF1</option><option>SLF2</option><option>SIMC1</option></optgroup><optgroup label="复合体模块"><option>C1_Core</option><option>C2_Canonical</option><option>C3_SLF_repair</option><option>C4_SIMC</option></optgroup></select></div><label class="toggle"><input type="checkbox" id="annotations" checked>标注主要群体</label><div class="field"><label for="point-size">点大小</label><select id="point-size"><option value="1.7">小</option><option value="2.3" selected>中</option><option value="3">大</option></select></div><span id="status" class="status">准备加载</span></div><div class="loader"><i id="progress"></i></div><div id="plot"></div><div id="group-summary" class="group-summary" aria-live="polite"></div><p id="group-hint" class="group-hint"></p><section class="expr-panel"><div class="expr-head"><h2>细胞亚型与 SMC5/6 表达清单</h2><div class="expr-tools"><input id="cell-filter" type="search" placeholder="筛选细胞、谱系、条件或聚类"><button id="download-expression" class="download">下载当前队列表格 CSV</button></div></div><p id="expr-description">按来源的细胞亚型、原始聚类和组织条件逐组汇总；表达均值与检出比例都是细胞层面的描述性统计。</p><div class="table-wrap"><table id="expression-table"></table></div><div id="paired-tests"></div></section><p class="note">显示所选队列的全部细胞。拖动旋转，滚轮缩放，双击复位；第三维来自该队列的全转录组邻居图（或 Harmony 低维表示）重新计算。不同队列的 <script>
const files={CRC:'assets/multicohort/3d/CRC_3d.json.gz',BRCA:'assets/multicohort/3d/BRCA_3d.json.gz',LUAD_GSE131907:'assets/multicohort/3d/LUAD_GSE131907_3d.json.gz',LUAD:'assets/multicohort/3d/LUAD_3d.json.gz'};

let dataCache={};
function $(id){return document.getElementById(id)}
function unique(a){return [...new Set(a.map(cleanLabel))]}
function categorical(values){let cats=unique(values),map=new Map(cats.map((x,i)=>[x,i])),counts=new Map(cats.map(x=>[x,0]));values.forEach(v=>counts.set(cleanLabel(v),(counts.get(cleanLabel(v))||0)+1));let colorscale=[];cats.forEach((_,i)=>{let lo=i/cats.length,hi=(i+1)/cats.length;colorscale.push([lo,palette[i%palette.length]],[hi,palette[i%palette.length]])});return {cats,counts,color:values.map(v=>map.get(cleanLabel(v))),colorscale,cmin:-.5,cmax:cats.length-.5,colorbar:{title:'类别',tickmode:'array',tickvals:cats.map((_,i)=>i),ticktext:cats,tickfont:{size:10},len:.84}}}
function traceFor(d,field){let vals,style,groupTrace=null;const categoricalField=names[field];if(categoricalField){vals=d.data[categoricalField];style=categorical(vals);renderSummary(style,d.n_cells,field);if($('annotations').checked&&['lineage','celltype','cluster'].includes(field)){const minShare=field==='celltype'?.025:.008,maxLabels=field==='celltype'?10:field==='cluster'?14:12;const groups=style.cats.map((name,i)=>({name,count:style.counts.get(name),index:i})).filter(g=>g.count/d.n_cells>=minShare).sort((a,b)=>b.count-a.count).slice(0,maxLabels);const lx=[],ly=[],lz=[],lt=[],lc=[];for(const g of groups){let xs=0,ys=0,zs=0;for(let i=0;i<vals.length;i++){if(cleanLabel(vals[i])===g.name){xs+=d.data.x[i];ys+=d.data.y[i];zs+=d.data.z[i]}}const cx=xs/g.count,cy=ys/g.count,cz=zs/g.count;let best=-1,dist=Infinity;for(let i=0;i<vals.length;i++){if(cleanLabel(vals[i])!==g.name)continue;const dd=(d.data.x[i]-cx)**2+(d.data.y[i]-cy)**2+(d.data.z[i]-cz)**2;if(dd<dist){dist=dd;best=i}}lx.push(d.data.x[best]);ly.push(d.data.y[best]);lz.push(d.data.z[best]);lt.push(`${g.name}  n=${g.count.toLocaleString()}`);lc.push(palette[g.index%palette.length])}groupTrace={type:'scatter3d',mode:'markers+text',x:lx,y:ly,z:lz,text:lt,textposition:'top center',hoverinfo:'skip',marker:{size:5,color:'#fff',line:{color:lc,width:2},opacity:.98},textfont:{size:12,color:'#152d32',family:'Arial, sans-serif'},showlegend:false,name:'群体注释'}}}else{vals=d.data[field];if(genes.includes(field)){style={color:vals,colorscale:[[0,'#edf2ef'],[.25,'#a9c7bd'],[.6,'#e2a36f'],[1,'#9f3f38']],cmin:0,cmax:vals.reduce((m,v)=>Number.isFinite(v)?Math.max(m,v):m,1),colorbar:{title:'来源处理后<br>表达值',tickfont:{size:10},len:.78}}}else{style={color:vals,colorscale:[[0,'#3f7c83'],[.5,'#f7f5ef'],[1,'#a8433b']],cmin:-2,cmax:2,colorbar:{title:'队列内<br>标准分',tickfont:{size:10},len:.78}}}renderSummary(null,d.n_cells,field)}
 const hover=d.data.celltype.map((t,i)=>`${cleanLabel(t)}<br>谱系: ${cleanLabel(d.data.lineage[i])}<br>来源聚类: ${cleanLabel(d.data.cluster[i])}<br>条件: ${cleanLabel(d.data.condition[i])}<br>样本: ${cleanLabel(d.data.sample[i])}<br>供体: ${cleanLabel(d.data.donor[i])}`);
 const points={type:'scatter3d',mode:'markers',x:d.data.x,y:d.data.y,z:d.data.z,text:hover,hovertemplate:'%{text}<br>UMAP 1: %{x:.2f}<br>UMAP 2: %{y:.2f}<br>UMAP 3: %{z:.2f}<extra></extra>',marker:{size:+$('point-size').value,opacity:.66,color:style.color,colorscale:style.colorscale,cmin:style.cmin,cmax:style.cmax,colorbar:style.colorbar,showscale:!categoricalField,line:{width:0}},name:labels[d.cohort]};return groupTrace?[points,groupTrace]:[points]}
function renderSummary(style,total,field){const box=$('group-summary'),hint=$('group-hint');box.replaceChildren();if(!style){hint.textContent='当前为连续表达/模块着色；选择“主要细胞谱系、细胞亚型或聚类标签”可显示群体位置注释。';return}const ranked=style.cats.map(name=>({name,count:style.counts.get(name)})).sort((a,b)=>b.count-a.count);const shown=field==='cluster'?ranked.slice(0,20):ranked;for(const g of shown){const chip=document.createElement('span');chip.className='group-chip';const colorIndex=style.cats.indexOf(g.name);chip.innerHTML=`<i class=\"swatch\" style=\"background:${palette[colorIndex%palette.length]}\"></i>${escapeHtml(g.name)} <b>${g.count.toLocaleString()}</b> · ${(100*g.count/total).toFixed(1)}%`;box.append(chip)}if(ranked.length>shown.length){const rest=ranked.slice(shown.length).reduce((n,g)=>n+g.count,0);const chip=document.createElement('span');chip.className='group-chip';chip.textContent=`其余 ${ranked.length-shown.length} 类 · ${rest.toLocaleString()} cells`;box.append(chip)}hint.textContent=field==='cluster'?'聚类为来源数据中的计算标签；其他标注沿用原始细胞注释。图中只标注占比靠前的主要群体，悬停可查看单细胞标签。':'下方彩色标签列出各类别细胞数；图中仅标注占比靠前的主要群体，坐标取群体中心附近的真实细胞点。'}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function cleanLabel(v){const s=String(v??'').trim();return !s||/^(nan|na|null|undefined)$/i.test(s)?'Unknown':s}
function aggregateExpression(d){const crc=d.cohort==='CRC',groups=new Map();const n=d.n_cells;for(let i=0;i<n;i++){const lineage=cleanLabel(d.data.lineage[i]),celltype=cleanLabel(d.data.celltype[i]),condition=cleanLabel(d.data.condition[i]),cluster=cleanLabel(d.data.cluster[i]);const key=crc?`${lineage}\u0000${celltype}`:`${lineage}\u0000${celltype}\u0000${condition}`;let g=groups.get(key);if(!g){g={lineage,celltype,conditions:new Map(),clusters:new Map()};groups.set(key,g)}g.clusters.set(cluster,(g.clusters.get(cluster)||0)+1);let c=g.conditions.get(condition);if(!c){c={n:0,donors:new Set(),sum5:0,n5:0,pos5:0,sum6:0,n6:0,pos6:0};g.conditions.set(condition,c)}c.n++;const donor=cleanLabel(d.data.donor[i]);if(donor!=='Unknown')c.donors.add(donor);const av=d.data.SMC5[i],bv=d.data.SMC6[i],a=av===null||av===''?NaN:Number(av),b=bv===null||bv===''?NaN:Number(bv);if(Number.isFinite(a)){c.sum5+=a;c.n5++;if(a>0)c.pos5++}if(Number.isFinite(b)){c.sum6+=b;c.n6++;if(b>0)c.pos6++}}
 const rows=[];for(const g of groups.values()){const clusterText=[...g.clusters].sort((a,b)=>a[0].localeCompare(b[0],undefined,{numeric:true})).map(([k,v])=>`${k} (${v})`).join(', ');if(crc){const t=g.conditions.get('Tumor'),normal=g.conditions.get('Normal');if(!t&&!normal)continue;const avg=(c,k)=>c&&c[`n${k}`]?c[`sum${k}`]/c[`n${k}`]:null,mean5t=avg(t,'5'),mean5n=avg(normal,'5'),mean6t=avg(t,'6'),mean6n=avg(normal,'6');rows.push({cohort:d.cohort,lineage:g.lineage,celltype:g.celltype,clusters:clusterText,conditions:'Tumor / Normal',nTumor:t?.n||0,nNormal:normal?.n||0,donorTumor:t?.donors.size||0,donorNormal:normal?.donors.size||0,smc5Tumor:mean5t,smc5Normal:mean5n,delta5:mean5t!==null&&mean5n!==null?mean5t-mean5n:null,det5Tumor:t?.n5?100*t.pos5/t.n5:null,det5Normal:normal?.n5?100*normal.pos5/normal.n5:null,smc6Tumor:mean6t,smc6Normal:mean6n,delta6:mean6t!==null&&mean6n!==null?mean6t-mean6n:null,det6Tumor:t?.n6?100*t.pos6/t.n6:null,det6Normal:normal?.n6?100*normal.pos6/normal.n6:null})}else for(const [condition,c] of g.conditions){rows.push({cohort:d.cohort,lineage:g.lineage,celltype:g.celltype,clusters:clusterText,condition,n:c.n,donors:c.donors.size||null,smc5:c.n5?c.sum5/c.n5:null,det5:c.n5?100*c.pos5/c.n5:null,smc6:c.n6?c.sum6/c.n6:null,det6:c.n6?100*c.pos6/c.n6:null})}}
 rows.sort((a,b)=>a.lineage.localeCompare(b.lineage)||a.celltype.localeCompare(b.celltype)||String(a.condition||'').localeCompare(String(b.condition||'')));return rows}
function fmt(x,d=3){return x===null||x===undefined||!Number.isFinite(x)?'NA':x.toFixed(d)}
function renderExpression(d){currentRows=aggregateExpression(d);const table=$('expression-table');const crc=d.cohort==='CRC';const headers=crc?['主要谱系','细胞亚型（来源注释）','来源聚类及细胞数','细胞数：肿瘤','细胞数：正常','SMC5 均值：肿瘤','SMC5 均值：正常','SMC5 Δ（肿瘤−正常）','SMC5 检出率 T/N','SMC6 均值：肿瘤','SMC6 均值：正常','SMC6 Δ（肿瘤−正常）','SMC6 检出率 T/N']:['主要谱系','细胞亚型（来源注释）','组织/疾病标签','来源聚类及细胞数','细胞数','供体数','SMC5 均值','SMC5 检出率','SMC6 均值','SMC6 检出率'];table.replaceChildren();const thead=document.createElement('thead'),tr=document.createElement('tr');for(const h of headers){const th=document.createElement('th');th.textContent=h;tr.append(th)}thead.append(tr);table.append(thead);const body=document.createElement('tbody');for(const r of currentRows){const vals=crc?[r.lineage,r.celltype,r.clusters,r.nTumor.toLocaleString(),r.nNormal.toLocaleString(),fmt(r.smc5Tumor),fmt(r.smc5Normal),fmt(r.delta5),`${fmt(r.det5Tumor,1)}% / ${fmt(r.det5Normal,1)}%`,fmt(r.smc6Tumor),fmt(r.smc6Normal),fmt(r.delta6),`${fmt(r.det6Tumor,1)}% / ${fmt(r.det6Normal,1)}%`]:[r.lineage,r.celltype,r.condition,r.clusters,r.n.toLocaleString(),r.donors===null?'NA':r.donors.toLocaleString(),fmt(r.smc5),`${fmt(r.det5,1)}%`,fmt(r.smc6),`${fmt(r.det6,1)}%`];const row=document.createElement('tr');row.dataset.search=vals.join(' ').toLowerCase();for(let i=0;i<vals.length;i++){const td=document.createElement('td');td.textContent=vals[i];if(crc&&(i===7||i===11))td.className=(i===7?r.delta5:r.delta6)>0?'delta-pos':'delta-neg';row.append(td)}body.append(row)}table.append(body);$('expr-description').textContent=crc?'CRC：按来源细胞亚型汇总肿瘤与正常的细胞数、SMC5/SMC6 的 log1p(CP10k)均值、检出比例及肿瘤−正常差值。该差值是细胞层面的描述值，不是患者配对检验；下方另列患者配对统计。聚类编号沿用原始数据。':'按来源细胞亚型与组织/疾病标签分组；表达值沿用来源处理后的 log1p 规范化表达，检出率为表达值 > 0 的细胞比例。所有统计为细胞层面描述值；聚类编号沿用原始数据。不同队列表达尺度不可直接比较。';$('cell-filter').value='';renderPairedTests(d.cohort)}
let pairedExpressionRows=null;
function renderPairedTests(cohort){const box=$('paired-tests');box.replaceChildren();if(cohort!=='CRC')return;const h=document.createElement('h3');h.textContent='CRC：患者配对的 SMC5/SMC6 表达差异（推断统计）';box.append(h);const p=document.createElement('p');p.className='expr-foot';p.textContent='患者为统计单位（n pairs）；差值为肿瘤−正常的队列内 z 分数。q 值按细胞谱系内 14 项特征进行 BH 校正。该表是谱系层面统计，不代表每个细胞亚型分别显著。';box.append(p);const wrap=document.createElement('div');wrap.className='table-wrap';const t=document.createElement('table');const head=document.createElement('thead');head.innerHTML='<tr><th>谱系</th><th>基因</th><th>配对患者数</th><th>正常均值 z</th><th>肿瘤均值 z</th><th>Δ Tumor−Normal</th><th>95% CI</th><th>BH q</th></tr>';t.append(head);const body=document.createElement('tbody');const render=rows=>{for(const f of rows){if(!['SMC5_z','SMC6_z'].includes(f[1]))continue;const tr=document.createElement('tr');const ci=`${fmt(+f[7])} to ${fmt(+f[8])}`;const out=[f[0],f[1].replace('_z',''),f[2],fmt(+f[3]),fmt(+f[4]),fmt(+f[5]),ci,f[10]==='NA'?'NA':fmt(+f[10],4)];for(const x of out){const td=document.createElement('td');td.textContent=x;tr.append(td)}body.append(tr)}t.append(body);wrap.append(t);box.append(wrap)};if(pairedExpressionRows){render(pairedExpressionRows);return}fetch('assets/multicohort/paired_patient_celltype_expression_tests.tsv').then(r=>r.text()).then(txt=>{pairedExpressionRows=txt.trim().split('\n').slice(1).map(line=>line.split('\t').map(x=>x.replace(/^"|"$/g,'')));render(pairedExpressionRows)}).catch(e=>{const err=document.createElement('p');err.textContent='配对结果表暂时无法加载。';box.append(err);console.error(e)})}
function downloadExpression(){if(!currentRows.length)return;const cols=Object.keys(currentRows[0]);const q=v=>'"'+String(v??'').replace(/"/g,'""')+'"';const csv=[cols.join(','),...currentRows.map(r=>cols.map(k=>q(r[k])).join(','))].join('\r\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8'}));a.download=`${currentRows[0].cohort}_SMC5_SMC6_by_celltype.csv`;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
$('cell-filter').addEventListener('input',()=>{const q=$('cell-filter').value.trim().toLowerCase();for(const tr of $('expression-table').querySelectorAll('tbody tr'))tr.hidden=!tr.dataset.search.includes(q)});$('download-expression').addEventListener('click',downloadExpression);

async function loadCohort(cohort){$('status').textContent='加载 '+labels[cohort]+' 全部细胞…';$('progress').style.width='12%';if(!dataCache[cohort]){dataCache={};const r=await fetch(files[cohort]);if(!r.ok)throw Error(`数据加载失败 (${r.status})`);$('progress').style.width='28%';const bytes=await r.arrayBuffer();let raw;if('DecompressionStream'in window){raw=await new Response(new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'))).text()}else{throw Error('当前浏览器不支持 gzip 流解压，请使用新版 Chrome、Edge 或 Safari')}$('progress').style.width='82%';dataCache[cohort]=JSON.parse(raw)}const d=dataCache[cohort];renderExpression(d);const trace=traceFor(d,$('color').value);$('progress').style.width='92%';const layout={margin:{l:0,r:15,t:10,b:0},paper_bgcolor:'#fff',plot_bgcolor:'#fff',showlegend:false,scene:{xaxis:{title:'UMAP 1',backgroundcolor:'#f4f7f5',gridcolor:'#dce5e4',zerolinecolor:'#dce5e4'},yaxis:{title:'UMAP 2',backgroundcolor:'#f4f7f5',gridcolor:'#dce5e4',zerolinecolor:'#dce5e4'},zaxis:{title:'UMAP 3',backgroundcolor:'#f4f7f5',gridcolor:'#dce5e4',zerolinecolor:'#dce5e4'},aspectmode:'data',camera:{eye:{x:1.55,y:1.55,z:1.15}}}};await Plotly.react('plot',trace,layout,{responsive:true,displaylogo:false,scrollZoom:true});$('progress').style.width='100%';$('status').textContent=`${labels[cohort]} · ${d.n_cells.toLocaleString()} cells`;setTimeout(()=>$('progress').style.width='0%',500)}
async function update(){try{await loadCohort($('cohort').value)}catch(e){$('status').textContent=e.message;console.error(e)}}
$('cohort').addEventListener('change',update);$('color').addEventListener('change',update);$('annotations').addEventListener('change',update);$('point-size').addEventListener('change',update);update();
</script></body></html>
