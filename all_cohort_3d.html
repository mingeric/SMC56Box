<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>多队列 3D UMAP · SMC5/6</title><script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script><style>
:root{--ink:#192a31;--muted:#64747a;--line:#dce5e4;--green:#216e63;--paper:#f5f8f6}*{box-sizing:border-box}body{margin:0;background:#fff;color:var(--ink);font:14px/1.5 Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.wrap{padding:14px 16px}.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:10px 12px;background:var(--paper);border:1px solid var(--line);border-radius:10px}.field{display:flex;gap:7px;align-items:center}.field label{font-size:12px;color:var(--muted)}select{background:#fff;border:1px solid #c9d4d3;border-radius:6px;padding:7px 8px;color:var(--ink);font:inherit}#plot{height:620px;width:100%;margin-top:10px}.note{margin:9px 2px;color:var(--muted);font-size:12px}.status{color:var(--green);font-size:12px;margin-left:auto}.loader{height:4px;background:#e7eeeb;border-radius:9px;overflow:hidden}.loader i{display:block;height:100%;width:0;background:#388d7b;transition:width .2s}a{color:var(--green)}@media(max-width:600px){#plot{height:520px}.status{margin-left:0;width:100%}}
</style></head><body><div class="wrap"><div class="toolbar"><div class="field"><label for="cohort">队列</label><select id="cohort"><option value="CRC">CRC · GSE132465</option><option value="BRCA">BRCA · CELLxGENE</option><option value="LUAD_GSE131907">LUAD · GSE131907</option><option value="LUAD">LUAD · CELLxGENE</option></select></div><div class="field"><label for="color">颜色</label><select id="color"><option value="lineage">主要细胞谱系</option><option value="celltype">细胞亚型</option><option value="condition">组织/疾病标签</option><option value="cluster">原始聚类标签</option><optgroup label="SMC5/6 genes"><option>SMC5</option><option>SMC6</option><option>NSMCE1</option><option>NSMCE2</option><option>NSMCE3</option><option>NSMCE4A</option><option>EID3</option><option>SLF1</option><option>SLF2</option><option>SIMC1</option></optgroup><optgroup label="复合体模块"><option>C1_Core</option><option>C2_Canonical</option><option>C3_SLF_repair</option><option>C4_SIMC</option></optgroup></select></div><span id="status" class="status">准备加载</span></div><div class="loader"><i id="progress"></i></div><div id="plot"></div><p class="note">显示所选队列的全部细胞。拖动旋转，滚轮缩放，双击复位；第三维来自该队列的全转录组邻居图（或 Harmony 低维表示）重新计算。不同队列的坐标轴不可比较，UMAP 深度与距离不代表生物学距离。基因颜色为队列内标准化表达，模块分数见面板说明。原始细胞亚型按来源注释展示。</p></div>
<script>
const files={CRC:'assets/multicohort/3d/CRC_3d.json.gz',BRCA:'assets/multicohort/3d/BRCA_3d.json.gz',LUAD_GSE131907:'assets/multicohort/3d/LUAD_GSE131907_3d.json.gz',LUAD:'assets/multicohort/3d/LUAD_3d.json.gz'};
const labels={CRC:'CRC · GSE132465',BRCA:'BRCA · CELLxGENE',LUAD_GSE131907:'LUAD · GSE131907',LUAD:'LUAD · CELLxGENE'};
const palette=['#397f86','#d29a45','#8b77a8','#bd6255','#71a28e','#5e83b2','#a8a39b','#ce7d40','#4d9b9b','#a94b40','#78a4c7','#736258','#b1bd71','#bc8caa'];
const names={lineage:'lineage',celltype:'celltype',condition:'condition',cluster:'cluster'};
let dataCache={};
function $(id){return document.getElementById(id)}
function unique(a){return [...new Set(a.map(x=>x||'Unknown'))]}
function categorical(values){let cats=unique(values), map=new Map(cats.map((x,i)=>[x,i]));let colorscale=[];cats.forEach((_,i)=>{let lo=i/cats.length,hi=(i+1)/cats.length;colorscale.push([lo,palette[i%palette.length]],[hi,palette[i%palette.length]])});return {color:values.map(v=>map.get(v||'Unknown')),colorscale,cmin:-.5,cmax:cats.length-.5,colorbar:{title:'类别',tickmode:'array',tickvals:cats.map((_,i)=>i),ticktext:cats,tickfont:{size:10},len:.78}}}
function traceFor(d,field){let vals,style;if(names[field]){vals=d.data[names[field]];style=categorical(vals)}else{vals=d.data[field];style={color:vals,colorscale:[[0,'#3f7c83'],[.5,'#f7f5ef'],[1,'#a8433b']],cmin:-2,cmax:2,colorbar:{title:'队列内<br>表达分数',tickfont:{size:10},len:.78}}}
 const hover=d.data.celltype.map((t,i)=>`${t||'Unknown'}<br>样本: ${d.data.sample[i]||'NA'}<br>供体: ${d.data.donor[i]||'NA'}`);
 return {type:'scatter3d',mode:'markers',x:d.data.x,y:d.data.y,z:d.data.z,text:hover,hovertemplate:'%{text}<br>UMAP 1: %{x:.2f}<br>UMAP 2: %{y:.2f}<br>UMAP 3: %{z:.2f}<extra></extra>',marker:{size:2.2,opacity:.78,color:style.color,colorscale:style.colorscale,cmin:style.cmin,cmax:style.cmax,colorbar:style.colorbar},name:labels[d.cohort]}}
async function loadCohort(cohort){$('status').textContent='加载 '+labels[cohort]+' 全部细胞…';$('progress').style.width='12%';if(!dataCache[cohort]){dataCache={};const r=await fetch(files[cohort]);if(!r.ok)throw Error(`数据加载失败 (${r.status})`);$('progress').style.width='28%';const bytes=await r.arrayBuffer();let raw;if('DecompressionStream'in window){raw=await new Response(new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'))).text()}else{throw Error('当前浏览器不支持 gzip 流解压，请使用新版 Chrome、Edge 或 Safari')}$('progress').style.width='82%';dataCache[cohort]=JSON.parse(raw)}const d=dataCache[cohort];const trace=traceFor(d,$('color').value);$('progress').style.width='92%';const layout={margin:{l:0,r:15,t:10,b:0},paper_bgcolor:'#fff',plot_bgcolor:'#fff',showlegend:false,scene:{xaxis:{title:'UMAP 1',backgroundcolor:'#f4f7f5',gridcolor:'#dce5e4',zerolinecolor:'#dce5e4'},yaxis:{title:'UMAP 2',backgroundcolor:'#f4f7f5',gridcolor:'#dce5e4',zerolinecolor:'#dce5e4'},zaxis:{title:'UMAP 3',backgroundcolor:'#f4f7f5',gridcolor:'#dce5e4',zerolinecolor:'#dce5e4'},aspectmode:'data',camera:{eye:{x:1.55,y:1.55,z:1.15}}}};await Plotly.react('plot',[trace],layout,{responsive:true,displaylogo:false,scrollZoom:true});$('progress').style.width='100%';$('status').textContent=`${labels[cohort]} · ${d.n_cells.toLocaleString()} cells`;setTimeout(()=>$('progress').style.width='0%',500)}
async function update(){try{await loadCohort($('cohort').value)}catch(e){$('status').textContent=e.message;console.error(e)}}
$('cohort').addEventListener('change',update);$('color').addEventListener('change',update);update();
</script></body></html>
